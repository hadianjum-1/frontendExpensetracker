<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FinTrack — Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect trick
      // When GH Pages returns 404 for a deep link, this page encodes the
      // full path into a query param and redirects to index.html.
      // The script in index.html then decodes it and replaces history state
      // so React Router sees the correct URL.
      var l = window.location;
      var segmentCount = 1; // number of path segments in the repo name (1 for /frontendExpensetracker)
      var path = l.pathname
        .slice(1)
        .split('/')
        .slice(segmentCount)
        .join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' + path +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
